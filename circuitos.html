        const WeightShowcase = ({ selectedCarId, currentConfig, onUpdate, t }) => {

            const totalWeight = Object.values(currentWeights).reduce((a, b) => a + (parseFloat(b) || 0), 0);

        const VoltageShowcase = ({ voltage, setVoltage, t }) => { 
            const [amps, setAmps] = useState(1.2); 
            const [history, setHistory] = useState(new Array(24).fill(0.2)); 
            
            useEffect(() => { 
                const interval = setInterval(() => { 
                    const baseAmps = (voltage / 12) * 1.5; 
                    const noise = (Math.random() - 0.5) * 0.15; 
                    const newAmps = Math.max(0, baseAmps + noise); 
                    setAmps(newAmps); 
                    setHistory(prev => { 
                        const barHeight = Math.min(1, Math.max(0.1, newAmps / 3));

                return () => clearInterval(interval);

            return (
                <div className="w-full h-full flex flex-col relative z-10 text-white" title="Fuente de alimentación estabilizada">
                    <svg className="absolute top-0 left-0 w-6 h-6 pointer-events-none opacity-50" viewBox="0 0 32 32"><path d="M1 1 L10 1 L10 2 L2 2 L2 10 L1 10 Z" fill="#f97316"/></svg>
                    <svg className="absolute top-0 right-0 w-6 h-6 pointer-events-none opacity-50" viewBox="0 0 32 32"><path d="M31 1 L22 1 L22 2 L30 2 L30 10 L31 10 Z" fill="#f97316"/></svg>
                    <svg className="absolute bottom-0 left-0 w-6 h-6 pointer-events-none opacity-50" viewBox="0 0 32 32"><path d="M1 31 L10 31 L10 30 L2 30 L2 22 L1 22 Z" fill="#f97316"/></svg>
                    <svg className="absolute bottom-0 right-0 w-6 h-6 pointer-events-none opacity-50" viewBox="0 0 32 32"><path d="M31 31 L22 31 L22 30 L30 30 L30 22 L31 22 Z" fill="#f97316"/></svg>
                    
                    <div className="p-3 border-b border-orange-500/20 bg-orange-500/10 flex justify-between items-center shrink-0">

                            ))}
                            <span className="absolute top-1 right-1.5 text-[8px] text-orange-400/50 font-mono font-bold">LOAD MONITOR</span>

                        <div className="flex items-center gap-3 mt-2">

                            </div>

        // GEOMETRÍA ABSOLUTA
        const getPieceGeometry = (p) => {
            if (!p || p.type === 'set_origin' || p.type === 'goto') return null;
            
            const brand = TRACK_DEFINITIONS[p.brandKey || 'NINCO'] || TRACK_DEFINITIONS['NINCO'];
            const laneOff = brand.laneSpacing / 2;
            const isSingleLane = p.subtype && p.subtype.includes('single_lane');

            let dx = 0, dy = 0, da = 0;
            let effectiveRadius = p.radius || 20;

            if (p.type === 'curve') {
                if (p.subtype === 'single_lane_1') {
                    effectiveRadius = p.direction === 'left' ? Math.abs(p.radius) - laneOff : Math.abs(p.radius) + laneOff;
                } else if (p.subtype === 'single_lane_2') {
                    effectiveRadius = p.direction === 'left' ? Math.abs(p.radius) + laneOff : Math.abs(p.radius) - laneOff;
                }
            }

            if (p.type === 'straight' || (p.type && p.type.includes('pit'))) { 
                dx = p.length; 
                if (p.shiftY) dy = p.shiftY;
            } else if (p.type === 'curve') {
                const r = Math.abs(effectiveRadius);
                const aRad = (p.angle * Math.PI) / 180;
                if (p.direction === 'left') { 
                    dx = r * Math.sin(aRad); dy = -r * (1 - Math.cos(aRad)); da = -aRad; 
                } else { 
                    dx = r * Math.sin(aRad); dy = r * (1 - Math.cos(aRad)); da = aRad; 
                }
            } else if (p.type === 'rotonda' || p.subtype === 'rotonda') {
                da = Math.PI;
            } else if (p.type === 'compound_curve_change') {
                const r = Math.abs(effectiveRadius);
                const aRad = (p.angle * Math.PI) / 180;
                if (p.direction === 'left') { 
                    dx = p.length + r * Math.sin(aRad); dy = -r * (1 - Math.cos(aRad)); da = -aRad; 
                } else { 
                    dx = p.length + r * Math.sin(aRad); dy = r * (1 - Math.cos(aRad)); da = aRad; 
                }
            }

            const rot = p.rot || 0;
            const z = p.elevation || 0;
            const exitX = p.x + dx * Math.cos(rot) - dy * Math.sin(rot);
            const exitY = p.y + dx * Math.sin(rot) + dy * Math.cos(rot);
            const exitAngle = rot + da;

            let midX = (p.x + exitX) / 2;
            let midY = (p.y + exitY) / 2;
            let hitRadius = p.type === 'straight' ? p.length / 2 : Math.abs(effectiveRadius);

            if (p.type === 'rotonda' || p.subtype === 'rotonda') {
                const straightLen = 1.0;
                midX = p.x + (straightLen + (p.radius || 15)) * Math.cos(rot);
                midY = p.y + (straightLen + (p.radius || 15)) * Math.sin(rot);
                hitRadius = (p.radius || 15) + straightLen;
            } else if (p.type === 'compound_curve_change') {
                hitRadius = Math.max(p.length, Math.abs(effectiveRadius));
            }

            let inNodes = [];
            let outNodes = [];

            if (isSingleLane || p.type === 'rotonda' || p.subtype === 'rotonda') {
                inNodes.push({ x: p.x, y: p.y, angle: rot, role: 'center' });
                outNodes.push({ x: exitX, y: exitY, angle: exitAngle, role: 'center' });
            } else {
                inNodes.push({ x: p.x, y: p.y, angle: rot, role: 'center' });
                outNodes.push({ x: exitX, y: exitY, angle: exitAngle, role: 'center' });
                inNodes.push({ x: p.x + laneOff * Math.sin(rot), y: p.y - laneOff * Math.cos(rot), angle: rot, role: 'rail' });
                outNodes.push({ x: exitX + laneOff * Math.sin(exitAngle), y: exitY - laneOff * Math.cos(exitAngle), angle: exitAngle, role: 'rail' });
                inNodes.push({ x: p.x - laneOff * Math.sin(rot), y: p.y + laneOff * Math.cos(rot), angle: rot, role: 'rail' });
                outNodes.push({ x: exitX - laneOff * Math.sin(exitAngle), y: exitY + laneOff * Math.cos(exitAngle), angle: exitAngle, role: 'rail' });
            }

            return {
                inX: p.x, inY: p.y, inZ: z, inAngle: rot,
                outX: exitX, outY: exitY, outZ: z, outAngle: exitAngle,
                localDx: dx, localDy: dy, localDa: da,
                midX, midY, hitRadius, inNodes, outNodes, isSingleLane
            };
        };

        const migrateToAbsolute = (piecesList, circuitOrigin = {x:0, y:0}) => {
            let cx = circuitOrigin.x || 0, cy = circuitOrigin.y || 0, currentAngle = 0;
            const endPos = {};

            return piecesList.map((p, index) => {
                if (!p) return null;
                
                if (p.type === 'set_origin') {
                    cx = circuitOrigin.x + (p.x || 0);
                    cy = circuitOrigin.y + (p.y || 0);
                    currentAngle = p.angle || 0;
                    endPos[p.uid] = { cx, cy, currentAngle };
                    return { ...p, x: cx, y: cy, rot: currentAngle };
                }

                if (p.type === 'goto') {
                    if (endPos[p.targetUid]) {
                        cx = endPos[p.targetUid].cx;
                        cy = endPos[p.targetUid].cy;
                        currentAngle = endPos[p.targetUid].currentAngle;
                    }
                    endPos[p.uid] = { cx, cy, currentAngle };
                    return { ...p, x: cx, y: cy, rot: currentAngle };
                }

                if (p.x !== undefined && p.rot !== undefined) return p; 
                
                const brand = TRACK_DEFINITIONS[p.brandKey || 'NINCO'] || TRACK_DEFINITIONS['NINCO'];
                const laneOff = brand.laneSpacing / 2;
                
                let pX = cx, pY = cy, pRot = currentAngle;
                if (p.invert && p.subtype !== 'rotonda') pRot += Math.PI;

                let dx = 0, dy = 0, dAngle = 0;
                if (p.type === 'rotonda' || p.subtype === 'rotonda') { dAngle = Math.PI; }
                else if (p.type === 'straight' || (p.type && p.type.includes('pit'))) { 
                    dx = p.length; 
                    if (p.shiftY) dy = p.shiftY;
                }
                else if (p.type === 'compound_curve_change') {
                    let effectiveRadius = Math.abs(p.radius);
                    const aRad = (p.angle * Math.PI) / 180;
                    if (p.direction === 'left') { dx = p.length + effectiveRadius * Math.sin(aRad); dy = -effectiveRadius * (1 - Math.cos(aRad)); dAngle = -aRad; }
                    else { dx = p.length + effectiveRadius * Math.sin(aRad); dy = effectiveRadius * (1 - Math.cos(aRad)); dAngle = aRad; }
                }
                else if (p.type === 'curve') {
                    let effectiveRadius = Math.abs(p.radius);
                    if (p.subtype === 'single_lane_1') effectiveRadius = p.direction === 'left' ? effectiveRadius - laneOff : effectiveRadius + laneOff;
                    else if (p.subtype === 'single_lane_2') effectiveRadius = p.direction === 'left' ? effectiveRadius + laneOff : effectiveRadius - laneOff;
                    
                    const r = effectiveRadius;
                    const aRad = (p.angle * Math.PI) / 180;
                    if (p.direction === 'left') { dx = r * Math.sin(aRad); dy = -r * (1 - Math.cos(aRad)); dAngle = -aRad; }
                    else { dx = r * Math.sin(aRad); dy = r * (1 - Math.cos(aRad)); dAngle = aRad; }
                }
                if (p.invert && p.subtype !== 'rotonda') { dx = -dx; dy = -dy; }

                cx += dx * Math.cos(currentAngle) - dy * Math.sin(currentAngle);
                cy += dx * Math.sin(currentAngle) + dy * Math.cos(currentAngle);
                currentAngle += dAngle;

                endPos[p.uid] = { cx, cy, currentAngle };

                return { ...p, x: pX, y: pY, rot: pRot, invert: false }; 
            }).filter(p => p && p.type !== 'goto' && p.type !== 'set_origin'); 
        };

        const getAngleDiff = (a1, a2) => {
            let diff = Math.abs((a1 - a2) % (Math.PI * 2));
            if (diff > Math.PI) diff = Math.PI * 2 - diff;
            return diff;
        };

        // Redirección súper inteligente para circuitos antiguos o con marca dañada
        const getResolvedBrand = (brandStr, pieces = []) => {
            let bStr = brandStr;
            
            // Si falta la marca, intentamos adivinarla mirando el código de la primera pieza
            if ((!bStr || bStr === 'undefined' || bStr === 'null') && pieces && pieces.length > 0) {
                const firstP = pieces.find(p => p && p.brandKey) || pieces[0];
                bStr = firstP.brandKey;
                if (!bStr || bStr === 'undefined' || bStr === 'null') {
                    const firstId = firstP.id || '';
                    if (firstId.startsWith('c_')) bStr = 'SCX_CLASSIC';
                    else if (firstId.startsWith('s_')) bStr = 'SCX_ANALOG';
                    else if (firstId.startsWith('adv_')) bStr = 'SCX_ADVANCE';
                    else if (firstId.startsWith('n_')) bStr = 'NINCO';
                    else if (firstId.startsWith('sca_')) bStr = 'SCALEAUTO';
                    else if (firstId.startsWith('pol_')) bStr = 'POLICAR';
                    else if (firstId.startsWith('suk_')) bStr = 'SCALEXTRIC_UK';
                    else if (firstId.startsWith('car_')) bStr = 'CARRERA';
                }
            }

            if (!bStr || bStr === 'undefined' || bStr === 'null') return 'NINCO';
            if (TRACK_DEFINITIONS[bStr]) return bStr;
            
            const upperStr = String(bStr).toUpperCase();
            if (upperStr.includes('UNIVERSAL') || upperStr === 'SCX_UNIVERSAL_GRISES' || upperStr === 'SCX_ANALOG') return 'SCX_ANALOG';
            // Si el circuito se etiquetó como "SCALEXTRIC" genérico (sin matizar clásico), asume SCX_ANALOG (Scalextric Gris)
            if (upperStr === 'SCALEXTRIC' || upperStr === 'SCX') return 'SCX_ANALOG'; 
            if (upperStr === 'SCX_ORIGINAL' || upperStr === 'SCX_CLASSIC' || upperStr === 'SCX CLÁSICO (NEGRO)' || upperStr === 'SCX_CLASSIC_NEGRAS') return 'SCX_CLASSIC';
            if (upperStr.includes('UK') || upperStr === 'SUPER_SLOT') return 'SCALEXTRIC_UK';
            if (upperStr.includes('ADVANCE')) return 'SCX_ADVANCE';
            
            const foundKey = Object.keys(TRACK_DEFINITIONS).find(k => TRACK_DEFINITIONS[k].name.toUpperCase() === upperStr);
            if (foundKey) return foundKey;

            return 'NINCO'; 
        };

        // Compilador 3D MEJORADO: ENCADENAMIENTO ESTRICTO Y CONTINUO
        const compileCircuitFor3D = (rawPieces, expandMacros = false) => {
            if (!rawPieces || rawPieces.length === 0) return [];
            
            const finalCompiled = [];
            
            // 0. ANTI-FANTASMAS: Eliminamos piezas superpuestas en las mismas coordenadas exactas
            const uniquePiecesMap = new Map();
            rawPieces.forEach(rawP => {
                if (!rawP) return;
                const p = JSON.parse(JSON.stringify(rawP));
                p.originalUid = rawP.uid; // INYECCIÓN: Protegemos la referencia original para evitar que los bloques se rompan
                // Clave basada en posición con precisión de 1mm
                const key = `${Math.round(p.x * 10) / 10}_${Math.round(p.y * 10) / 10}_${Math.round((p.rot || 0) * 10) / 10}_${p.lane || 0}`;
                uniquePiecesMap.set(key, p);
            });
            
            // 1. Clonamos profundamente las piezas y aplicamos sanitización básica
            const expandedPieces = [];

            Array.from(uniquePiecesMap.values()).forEach(p => {
                if (p.subtype === 'crossing_curve') p.subtype = 'crossing'; 

                const currentBrandKey = p.brandKey || (rawPieces.find(rp => rp.brandKey)?.brandKey) || 'NINCO';
                const brandDef = TRACK_DEFINITIONS[currentBrandKey] || TRACK_DEFINITIONS['NINCO'];

                const getDef = (subtype, fallbackBrand) => {
                    let def = brandDef.pieces.find(x => x.subtype === subtype);
                    let bKey = currentBrandKey;
                    if (!def) {
                        bKey = fallbackBrand;
                        def = TRACK_DEFINITIONS[fallbackBrand].pieces.find(x => x.subtype === subtype);
                    }
                    return { id: def?.id, brandKey: bKey };
                };

                if (p.subtype === 'squeeze') {
                    const inDef = getDef('chicane_entry', 'SCX_CLASSIC');
                    const outDef = getDef('chicane_exit', 'SCX_CLASSIC');

                    const p1 = { ...p, uid: p.uid + "_1", id: inDef.id, subtype: 'chicane_entry', length: p.length / 2, width: brandDef.width, laneSpacing: brandDef.laneSpacing, brandKey: inDef.brandKey };
                    const p2 = { ...p, uid: p.uid + "_2", id: outDef.id, subtype: 'chicane_exit', length: p.length / 2, width: brandDef.width, laneSpacing: brandDef.laneSpacing, brandKey: outDef.brandKey };
                    p2.x = p1.x + (p.length / 2) * Math.cos(p.rot || 0);
                    p2.y = p1.y + (p.length / 2) * Math.sin(p.rot || 0);
                    expandedPieces.push(p1, p2);
                    return; 
                }

                if (p.subtype === 'full_chicane' && expandMacros) {
                    const partLength = p.length / 3;
                    
                    let prefix = 'n_';
                    if (currentBrandKey === 'SCX_CLASSIC') prefix = 'c_';
                    else if (currentBrandKey === 'SCX_ANALOG') prefix = 's_';
                    else if (currentBrandKey === 'SCX_ADVANCE') prefix = 'adv_';
                    else if (currentBrandKey === 'SCALEXTRIC_UK') prefix = 'suk_';
                    else if (currentBrandKey === 'CARRERA') prefix = 'car_';

                    const isSCX = currentBrandKey.startsWith('SCX');

                    let inId = isSCX ? `${prefix}pt74_in` : `${prefix}chicane_in`;
                    let midId = isSCX ? `${prefix}pt74_mid` : `${prefix}chicane_mid`;
                    let outId = isSCX ? `${prefix}pt74_out` : `${prefix}chicane_out`;
                    
                    const subIn = isSCX ? 'chicane3_entry' : 'chicane_entry';
                    const subMid = isSCX ? 'chicane3_middle' : 'chicane_middle';
                    const subOut = isSCX ? 'chicane3_exit' : 'chicane_exit';

                    const p1 = { ...p, uid: p.uid + "_1", id: inId, label: isSCX ? "Chicane In (PT74)" : "Chicane In", subtype: subIn, length: partLength, width: brandDef.width, laneSpacing: brandDef.laneSpacing, brandKey: currentBrandKey, groupId: `macro_${Math.floor(p.uid)}_l8xv0` };
                    const p2 = { ...p, uid: p.uid + "_2", id: midId, label: isSCX ? "Chicane Med (PT74)" : "Chicane Med", subtype: subMid, length: partLength, width: brandDef.width, laneSpacing: brandDef.laneSpacing, brandKey: currentBrandKey, groupId: `macro_${Math.floor(p.uid)}_l8xv0` };
                    const p3 = { ...p, uid: p.uid + "_3", id: outId, label: isSCX ? "Chicane Out (PT74)" : "Chicane Out", subtype: subOut, length: partLength, width: brandDef.width, laneSpacing: brandDef.laneSpacing, brandKey: currentBrandKey, groupId: `macro_${Math.floor(p.uid)}_l8xv0` };
                    
                    p2.x = p1.x + partLength * Math.cos(p.rot || 0);
                    p2.y = p1.y + partLength * Math.sin(p.rot || 0);
                    p3.x = p2.x + partLength * Math.cos(p.rot || 0);
                    p3.y = p2.y + partLength * Math.sin(p.rot || 0);
                    
                    expandedPieces.push(p1, p2, p3);
                    return;
                }

                if (p.subtype === 'chicane_entry' || p.subtype === 'chicane3_entry' || p.subtype === 'chicane_middle' || p.subtype === 'chicane3_middle' || p.subtype === 'chicane_exit' || p.subtype === 'chicane3_exit' || p.subtype === 'crossing' || (!expandMacros && p.subtype === 'full_chicane')) {
                    p.width = brandDef.width; 
                    p.laneSpacing = brandDef.laneSpacing;
                }

                if (p.subtype === 'digital_str_curve_in' || p.subtype === 'digital_str_curve_out') {
                    delete p.subtype; p.id = 'car_345'; p.direction = 'left'; 
                } else if (p.subtype === 'digital_arc_curve_in') {
                    p.subtype = p.direction === 'left' ? 'change_left' : 'change_right';
                } else if (p.subtype === 'digital_arc_curve_out') {
                    p.subtype = p.direction === 'left' ? 'change_right' : 'change_left';
                }

                if (p.type === 'straight' || (p.type && p.type.includes('pit'))) p.direction = 'left'; 

                // NO borramos `brandKey` ni `subtype` aquí para que la geometría 2D calcule los nodos de snapping perfectos.
                expandedPieces.push(p);
            });

            // 2. POOL ÚNICO: NO separamos por carril. Permitimos que rectas y single_lanes se conecten físicamente.
            let pool = [...expandedPieces];
            const origGeos = new Map();
            pool.forEach(p => origGeos.set(p.uid, getPieceGeometry(p)));

            const findNextPiece = (searchPointNodes, availablePool) => {
                let bestIdx = -1; let bestDist = Infinity; let connectedToIn = true; let targetSearchNode = null;

                for (let i = 0; i < availablePool.length; i++) {
                    const cand = availablePool[i];
                    const ep = origGeos.get(cand.uid);
                    
                    searchPointNodes.forEach(sNode => {
                        ep.inNodes.forEach((inNode) => {
                            const dist = Math.hypot(sNode.x - inNode.x, sNode.y - inNode.y);
                            const aDiff = getAngleDiff(sNode.angle, inNode.angle);
                            if (dist < 15.0 && aDiff < 0.5 && dist < bestDist) {
                                bestDist = dist; bestIdx = i; connectedToIn = true; targetSearchNode = sNode;
                            }
                        });
                        
                        const isCandRotonda = cand.type === 'rotonda' || cand.subtype === 'rotonda' || cand.subtype === 'rotonda_connect';
                        if (!isCandRotonda) {
                            ep.outNodes.forEach((outNode) => {
                                const dist = Math.hypot(sNode.x - outNode.x, sNode.y - outNode.y);
                                const aDiff = getAngleDiff(sNode.angle, (outNode.angle + Math.PI) % (Math.PI*2));
                                if (dist < 15.0 && aDiff < 0.5 && dist < bestDist) {
                                    bestDist = dist; bestIdx = i; connectedToIn = false; targetSearchNode = sNode;
                                }
                            });
                        }
                    });
                }
                return { bestIdx, connectedToIn, targetSearchNode };
            };

            let allChains = [];

            // 3. RECORRIDO DE CADENAS (Múltiples pasadas para detectar ramas/bifurcaciones)
            while(pool.length > 0) {
                let currentChain = [];

                let startIdx = pool.findIndex(p => p.type === 'rotonda' || p.subtype === 'rotonda' || p.subtype === 'rotonda_connect');
                if (startIdx === -1) startIdx = pool.findIndex(p => p.subtype === 'analog_connect' || p.subtype === 'connection' || p.subtype === 'starting_grid' || p.subtype === 'digital_console');
                
                if (startIdx === -1) {
                    startIdx = pool.findIndex(p => {
                        const ep = origGeos.get(p.uid);
                        let hasIncoming = false;
                        for (const other of pool) {
                            if (other.uid === p.uid) continue;
                            const oEp = origGeos.get(other.uid);
                            const distFromOut = Math.hypot(ep.inX - oEp.outX, ep.inY - oEp.outY);
                            const distFromIn = Math.hypot(ep.inX - oEp.inX, ep.inY - oEp.inY);
                            if ((distFromOut < 15.0 && getAngleDiff(ep.inAngle, oEp.outAngle) < 0.5) || 
                                (distFromIn < 15.0 && getAngleDiff(ep.inAngle, (oEp.inAngle + Math.PI)) < 0.5)) {
                                hasIncoming = true; break;
                            }
                        }
                        return !hasIncoming;
                    });
                }
                if (startIdx === -1) startIdx = 0;

                let current = pool.splice(startIdx, 1)[0];
                current.inZ = current.elevation || 0;
                current.outZ = current.elevation || 0;
                currentChain.push(current);
                
                let firstGeo = getPieceGeometry(current);
                let currentSearchExitNodes = firstGeo.outNodes.map(n => ({ ...n, z: current.outZ }));

                let chainContinues = true;
                while (chainContinues && pool.length > 0) {
                    const { bestIdx, connectedToIn, targetSearchNode } = findNextPiece(currentSearchExitNodes, pool);

                    if (bestIdx !== -1) {
                        let nextPiece = pool.splice(bestIdx, 1)[0];

                        if (!connectedToIn) {
                            if (nextPiece.type === 'curve' || nextPiece.subtype === 'chicane_curve' || nextPiece.type === 'rotonda' || nextPiece.subtype === 'rotonda' || nextPiece.subtype === 'rotonda_connect') {
                                nextPiece.direction = nextPiece.direction === 'left' ? 'right' : 'left';
                            }
                            const tmpL = nextPiece.borderLeft; nextPiece.borderLeft = nextPiece.borderRight; nextPiece.borderRight = tmpL;
                            
                            if (nextPiece.subtype === 'chicane_entry') { 
                                nextPiece.subtype = 'chicane_exit'; 
                                if (nextPiece.id === 'n_chicane_in') nextPiece.id = 'n_chicane_out'; 
                                else if (nextPiece.id === 'c_pt55') nextPiece.id = 'c_pt56';
                                else if (nextPiece.id === 's_chicane_in') nextPiece.id = 's_chicane_out';
                                else if (nextPiece.id === 'suk_chicane_in') nextPiece.id = 'suk_chicane_out';
                            } 
                            else if (nextPiece.subtype === 'chicane_exit') { 
                                nextPiece.subtype = 'chicane_entry'; 
                                if (nextPiece.id === 'n_chicane_out') nextPiece.id = 'n_chicane_in'; 
                                else if (nextPiece.id === 'c_pt56') nextPiece.id = 'c_pt55';
                                else if (nextPiece.id === 's_chicane_out') nextPiece.id = 's_chicane_in';
                                else if (nextPiece.id === 'suk_chicane_out') nextPiece.id = 'suk_chicane_in';
                            }
                            else if (nextPiece.subtype === 'chicane3_entry') { 
                                nextPiece.subtype = 'chicane3_exit'; 
                                if (nextPiece.id === 'c_pt74_in') nextPiece.id = 'c_pt74_out';
                                else if (nextPiece.id === 's_pt74_in') nextPiece.id = 's_pt74_out';
                                else if (nextPiece.id === 'adv_pt74_in') nextPiece.id = 'adv_pt74_out';
                            }
                            else if (nextPiece.subtype === 'chicane3_exit') { 
                                nextPiece.subtype = 'chicane3_entry'; 
                                if (nextPiece.id === 'c_pt74_out') nextPiece.id = 'c_pt74_in';
                                else if (nextPiece.id === 's_pt74_out') nextPiece.id = 's_pt74_in';
                                else if (nextPiece.id === 'adv_pt74_out') nextPiece.id = 'adv_pt74_in';
                            }
                            else if (nextPiece.subtype === 'jump_up') { nextPiece.subtype = 'jump_down'; if (nextPiece.id === 'suk_pack2_1') nextPiece.id = 'suk_pack2_2'; }
                            else if (nextPiece.subtype === 'jump_down') { nextPiece.subtype = 'jump_up'; if (nextPiece.id === 'suk_pack2_2') nextPiece.id = 'suk_pack2_1'; }
                            else if (nextPiece.subtype === 'single_lane_1') { nextPiece.subtype = 'single_lane_2'; }
                            else if (nextPiece.subtype === 'single_lane_2') { nextPiece.subtype = 'single_lane_1'; }
                            
                            if (nextPiece.type === 'pit_entry') nextPiece.type = 'pit_exit'; else if (nextPiece.type === 'pit_exit') nextPiece.type = 'pit_entry';
                            
                            if (nextPiece.subtype === 'adapter_ninco_scx') nextPiece.subtype = 'adapter_scx_ninco'; else if (nextPiece.subtype === 'adapter_scx_ninco') nextPiece.subtype = 'adapter_ninco_scx';
                            else if (nextPiece.subtype === 'adapter_ninco_suk') nextPiece.subtype = 'adapter_suk_ninco'; else if (nextPiece.subtype === 'adapter_suk_ninco') nextPiece.subtype = 'adapter_ninco_suk';
                            else if (nextPiece.subtype === 'adapter_scx_adv') nextPiece.subtype = 'adapter_adv_scx'; else if (nextPiece.subtype === 'adapter_adv_scx') nextPiece.subtype = 'adapter_scx_adv';

                            if (nextPiece.widthIn !== undefined) { const tw = nextPiece.widthIn; nextPiece.widthIn = nextPiece.widthOut; nextPiece.widthOut = tw; }
                            if (nextPiece.laneSpacingIn !== undefined) { const tls = nextPiece.laneSpacingIn; nextPiece.laneSpacingIn = nextPiece.laneSpacingOut; nextPiece.laneSpacingOut = tls; }
                        }

                        nextPiece.invert = false;
                        nextPiece.rot = targetSearchNode.angle;
                        
                        const ep = getPieceGeometry(nextPiece);
                        let bestLocalDist = Infinity; let alignNode = ep.inNodes[0];
                        ep.inNodes.forEach(n => { const d = Math.hypot(targetSearchNode.x - n.x, targetSearchNode.y - n.y); if (d < bestLocalDist) { bestLocalDist = d; alignNode = n; } });
                        
                        nextPiece.x += (targetSearchNode.x - alignNode.x);
                        nextPiece.y += (targetSearchNode.y - alignNode.y);
                        nextPiece.inZ = targetSearchNode.z;
                        nextPiece.outZ = nextPiece.elevation || 0;
                        
                        const finalEp = getPieceGeometry(nextPiece);
                        currentSearchExitNodes = finalEp.outNodes.map(n => ({ ...n, z: nextPiece.outZ }));
                        
                        currentChain.push(nextPiece);
                    } else {
                        chainContinues = false; 
                    }
                }
                
                if (currentChain.length > 0) allChains.push(currentChain);
            }

            // 4. EXPORTACIÓN SEGURA:
            allChains.forEach((chain, chainIndex) => {
                const chainBaseUid = Date.now() - 1000000 + (chainIndex * 500000);
                let currentLaneMap = { 1: 1, 2: 2 }; // Seguimiento físico de los carriles

                chain.forEach((p, idx) => {
                    p.uid = chainBaseUid + (idx * 1000) + 0.1234; 
                    p.chainIndex = chainIndex;
                    p.chainOrder = idx; // Orden explícito del camino
                    p.laneMapping = { ...currentLaneMap }; // Mapa de cruces de carril

                    // Si es un cruce, invertimos la asignación para la siguiente pista
                    if (p.subtype === 'crossing' || p.subtype === 'crossing_curve') {
                        currentLaneMap = { 1: currentLaneMap[2], 2: currentLaneMap[1] };
                    }

                    // Forzamos lane 0 para evitar el bug de los 8 carriles paralelos en el 3D
                    if (p.lane === undefined || p.subtype === 'single_lane_1' || p.subtype === 'single_lane_2') {
                        p.lane = 0;

                            ctx.strokeStyle = startLane === 1 ? '#ef4444' : '#3b82f6'; // Rojo para carril 1, Azul para carril 2

                            ctx.lineCap = 'round';
                            
                            let needMoveTo = true;

                            chain.forEach((p) => {
                                const geo = p.worldGeo;
                                if (!geo) return;
                                
                                const isSingle1 = p.subtype === 'single_lane_1';
                                const isSingle2 = p.subtype === 'single_lane_2';
                                
                                // Si trazamos la línea 1 (Rojo) omitimos la pieza del carril 2 (Azul), y viceversa.
                                if (startLane === 1 && isSingle2) { needMoveTo = true; return; }

                                let inNodeIdx = currentLane;
                                let outLane = p.laneMapping ? p.laneMapping[currentLane] : currentLane;
                                let outNodeIdx = outLane;
                                
                                // Las pistas de 1 carril o rotondas solo tienen nodo 0 en geometría
                                if (isSingle1 || isSingle2 || p.type === 'rotonda' || p.subtype === 'rotonda' || p.subtype === 'rotonda_connect') {

                                    outNodeIdx = 0;
                                }

                                if (needMoveTo) {
                                    ctx.moveTo(view.x + inNode.x * s, view.y + inNode.y * s);

                                } else {
                                    ctx.lineTo(view.x + inNode.x * s, view.y + inNode.y * s);
                                }

                ctx.clearRect(0, 0, width, height); const tempView = { x: 0, y: 0, scale: 1.0 };

                ctx.save(); ctx.globalAlpha = 0;

                absPieces.forEach(p => p.brandKey = getResolvedBrand(p.brandKey || circuit.brand, [p]));

                if (positions.length === 0) return;
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

                if (circuit.boardPoints && circuit.boardPoints.length > 0) { circuit.boardPoints.forEach(p => { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }); }
                const contentW = maxX - minX; const contentH = maxY - minY; const padding = 15;

                            </div>
    
                            <div className="space-y-4"> 
                                <button onClick={toggleInvertPiece} className="w-full flex items-center justify-center gap-3 px-4 py-4 rounded-xl text-xs font-bold bg-[#1e293b] text-gray-400 border border-[#334155] hover:bg-[#334155] transition shadow-[0_0_10px_rgba(255,255,255,0.1)] hover:shadow-[0_0_15px_rgba(255,255,255,0.2)] mb-4"><Repeat size={18}/> {t.piece.invert}</button> 
                            </div> 
                              
                              <div className="pt-3 mt-4 border-t border-white/10 space-y-2">
                                  <button onClick={removePiece} className="w-full flex items-center justify-center gap-2 px-4 py-3 bg-red-900/20 text-red-500 border border-red-900/50 rounded-xl text-xs font-bold hover:bg-red-900/40 transition shadow-[0_0_10px_rgba(239,68,68,0.2)] hover:shadow-[0_0_20px_rgba(239,68,68,0.4)]">
                                      <Trash2 size={18}/> {t.piece.delete}
                                  </button>
                              </div>
                          </div> 
                      );
                  })()}
              </div>
            </div>
          );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            try { const root = ReactDOM.createRoot(rootElement); root.render(<SlotDesigner />); } 
            catch (error) { console.error("Error al renderizar:", error); document.getElementById('loading-screen').innerHTML = `<h2 class="text-xl text-red-500 font-bold">Error fatal</h2><p class="text-white">${error.message}</p>`; }
        }
    </script>
</body>
</html>
